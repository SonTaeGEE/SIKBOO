name: Deploy Spring Boot to OCI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build JAR
        run: |
          cd BE
          chmod +x ./gradlew
          ./gradlew clean bootJar

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "BE/build/libs/*.jar"
          target: "/opt/sikboo/"
          overwrite: true
          strip_components: 3

      - name: Restart Spring Boot service on server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 서비스가 안 떠 있어도 에러 내지 말고 넘어가게
            sudo systemctl stop sikboo || true

            # /opt/sikboo 아래 .jar 중 "가장 최근" 파일 하나 선택
            LATEST_JAR=$(ls -t /opt/sikboo/*.jar | head -n 1)
            echo "Using JAR: $LATEST_JAR"

            # 그걸 sikboo.jar 이름으로 덮어쓰기
            sudo mv "$LATEST_JAR" /opt/sikboo/sikboo.jar

            # 서비스 다시 시작 + 상태 확인
            sudo systemctl start sikboo
            sudo systemctl status sikboo --no-pager
